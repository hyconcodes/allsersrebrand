<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Allsers</title>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

        :root {
            --bg: #fafafa;
            --fg: #171717;
            --muted: #737373;
            --subtle: #a3a3a3;
            --border: #e5e5e5;
            --card: #ffffff;
            --glow: 106,17,203;
            --accent: #6a11cb;
            --accent-hover: #5a0eb0;
            --accent-light: #f7f1fe;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0a0a;
                --fg: #f5f5f5;
                --muted: #a3a3a3;
                --subtle: #525252;
                --border: #262626;
                --card: #171717;
                --accent-light: #1a0533;
            }
        }

        html {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: background .3s, color .3s;
        }

        .card {
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .icon-wrap {
            position: relative;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
        }

        .icon-glow {
            position: absolute;
            inset: 0;
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(var(--glow),.15) 0%, transparent 70%);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%,100%{opacity:.5;transform:scale(1)}
            50%{opacity:1;transform:scale(1.15)}
        }

        .icon-box {
            width: 88px;
            height: 88px;
            border-radius: 28px;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            box-shadow: 0 8px 32px rgba(0,0,0,.06);
            transition: background .3s, border-color .3s, box-shadow .3s;
        }

        .icon-box svg {
            width: 40px;
            height: 40px;
            color: var(--subtle);
            transition: color .3s;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -.03em;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .gradient-text {
            background: linear-gradient(135deg, #6a11cb 0%, #9b4dca 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: var(--muted);
            font-size: .95rem;
            font-weight: 500;
            line-height: 1.7;
            margin-bottom: 2.5rem;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
            transition: color .3s;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: .75rem;
        }

        .btn-primary {
            width: 100%;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 16px;
            background: var(--accent);
            color: #fff;
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            transition: background .2s, transform .15s, box-shadow .2s;
            box-shadow: 0 4px 16px rgba(var(--glow),.25);
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 24px rgba(var(--glow),.35);
        }

        .btn-primary:active {
            transform: scale(.95);
        }

        .btn-primary svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .btn-secondary {
            width: 100%;
            padding: .75rem 1.5rem;
            border: none;
            border-radius: 16px;
            background: transparent;
            color: var(--subtle);
            font-size: .85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            transition: color .2s, background .2s;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
            text-decoration: none;
        }

        .btn-secondary:hover {
            color: var(--accent);
            background: var(--accent-light);
        }

        .btn-secondary:active {
            transform: scale(.95);
        }

        .footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            transition: border-color .3s;
        }

        .footer span {
            font-size: .65rem;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--subtle);
            transition: color .3s;
        }

        @media (max-width: 400px) {
            h1 { font-size: 1.65rem; }
            .icon-box { width: 76px; height: 76px; border-radius: 22px; }
            .icon-box svg { width: 34px; height: 34px; }
            .icon-glow { width: 104px; height: 104px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">
            <div class="icon-glow"></div>
            <div class="icon-box">
                <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24">
                    <path d="M18.364 5.636a9 9 0 0 1 0 12.728m0 0-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 0 1 0 7.072m0 0-2.829-2.829m-4.243 4.243a4.978 4.978 0 0 1-1.414-2.83m-1.415 5.658a9 9 0 0 1-2.167-3.674m0 0L3 21m6.233-4.072a2 2 0 0 1-3.187-2.497m11.954-11.954a9 9 0 0 1 0 12.728m0 0-2.829-2.829M4.243 4.243a9 9 0 0 1 12.728 0m-4.243 4.243a4.978 4.978 0 0 1 2.83 1.415"/>
                </svg>
            </div>
        </div>

        <h1>You're <span class="gradient-text">Offline</span></h1>

        <p>
            Your connection took a break. Once you're back online, everything will pick up right where you left off.
        </p>

        <div class="actions">
            <button class="btn-primary" onclick="window.location.reload()">
                <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 0 0 4.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 0 1-15.357-2m15.357 2H15"/>
                </svg>
                Try Again
            </button>
            <a href="/" class="btn-secondary">Back to Home</a>
        </div>

        <div class="footer">
            <span>Allsers</span>
        </div>
    </div>

    <script>
        (function(){var e=document.querySelector('html');if(window.matchMedia('(prefers-color-scheme:dark)').matches)e.style.colorScheme='dark';else e.style.colorScheme='light';window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(t){e.style.colorScheme=t.matches?'dark':'light'})})();
    </script>
</body>
</html>
